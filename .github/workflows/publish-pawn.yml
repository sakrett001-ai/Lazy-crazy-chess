name: Publish verified white pawn
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pawn.yml'
      - 'prototypes/white-pawn/**'
      - 'floot/**'
      - 'prototypes/human-base/package*.json'
      - 'prototypes/human-base/licenses/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lazy-crazy-chess-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/human-base/package-lock.json
      - name: Install pinned viewer dependencies
        run: |
          npm ci --prefix prototypes/human-base
          npm ci --prefix prototypes/white-pawn
      - name: Verify exported equipment and motion
        working-directory: prototypes/white-pawn
        run: npm run verify:equipment
      - name: Verify anatomical joints and visible grips
        working-directory: prototypes/white-pawn
        run: |
          npm run verify:biomechanics
          npm run verify:grip
          npm run verify:weapon-clearance
          npm run verify:enarmes
      - name: Verify current modular geometry and runtime
        working-directory: prototypes/white-pawn
        run: npm run verify:geometry
      - name: Install test browser
        working-directory: prototypes/human-base
        run: npx playwright install --with-deps chromium
      - name: Verify release safety checks
        working-directory: prototypes/white-pawn
        run: npm run test:release
      - name: Build and verify standalone viewer
        working-directory: prototypes/white-pawn
        run: |
          npm run build
          npm run verify
          npm run verify:appearance
          npm run verify:variants
      - name: Build and verify hosted candidate
        working-directory: prototypes/white-pawn
        run: |
          npm run build:hosted
          npm run verify:hosted
          npm run release:hosted
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: white-pawn-verification
          if-no-files-found: ignore
          path: |
            prototypes/white-pawn/review/viewer-checks.json
            prototypes/white-pawn/review/equipment-checks.json
            prototypes/white-pawn/review/geometry-checks.json
            prototypes/white-pawn/review/biomechanics-checks.json
            prototypes/white-pawn/review/grip-checks.json
            prototypes/white-pawn/review/weapon-clearance-checks.json
            prototypes/white-pawn/review/enarme-checks.json
            prototypes/white-pawn/review/appearance-checks.json
            prototypes/white-pawn/review/variant-checks.json
            dist/review/
      - name: Publish exact release without replacing other pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$SOURCE_COMMIT" ]; then
            echo "A newer main commit exists; this release will not be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh auth setup-git
          site=$(mktemp -d)
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --single-branch --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" "$site"
          else
            git -C "$site" init -b gh-pages
            git -C "$site" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          mkdir -p "$site/chess/releases/$SOURCE_COMMIT"
          if [ -f "$site/chess/releases/$SOURCE_COMMIT/viewer.html" ] && ! cmp -s "dist/chess/releases/$SOURCE_COMMIT/viewer.html" "$site/chess/releases/$SOURCE_COMMIT/viewer.html"; then
            echo "An immutable release already exists with different bytes; publication refused." >&2
            exit 1
          fi
          cp "dist/chess/releases/$SOURCE_COMMIT/viewer.html" "$site/chess/releases/$SOURCE_COMMIT/viewer.html"
          cp dist/chess-release.json "$site/chess-release.json"
          git -C "$site" config user.name "github-actions[bot]"
          git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site" add -- chess-release.json "chess/releases/$SOURCE_COMMIT/viewer.html"
          if ! git -C "$site" diff --cached --quiet; then
            git -C "$site" commit -m "Verified white pawn release from $SOURCE_COMMIT"
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$SOURCE_COMMIT" ]; then
            echo "main changed during preparation; this release will not be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$site" push origin HEAD:refs/heads/gh-pages
          echo "Published white pawn from $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
